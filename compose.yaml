name: nexora
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ${BACKEND_BUILD_CONTEXT:-../backend-project/backend}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      API_URL: ${API_URL:-http://localhost:8000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      EXTRA_CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000},http://127.0.0.1:${WEB_PORT:-3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: /backend
        NEXT_PUBLIC_ENABLE_DEMO_FIXTURES: "false"
        NEXT_PUBLIC_ENABLE_BACKEND_DEMO_LOGIN: ${DEMO_LOGIN_ENABLED:-true}
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: /backend
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      TRANSLATION_BASE_URL: ${TRANSLATION_BASE_URL:-}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
