name: Frontend CD

# Deploy modeli: AWS EC2 da Docker Compose. Backend (api) va ma'lumotlar bazasi (db)
# alohida deploy qilinadi; bu workflow faqat frontend (web) xizmatini qayta quradi.
# Compose project nomi "nexora" (compose.yaml dagi `name:`), shuning uchun `web`
# bir xil tarmoqdagi mavjud `api` xizmatiga ulanadi.
#
# Repo Settings -> Secrets and variables -> Actions -> Secrets:
#   HOST_DNS     = EC2 public DNS yoki IP
#   EC2_SSH_KEY  = ec2-user uchun private SSH kaliti (backend repodagi bilan bir xil)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: AWS EC2 ga SSH orqali deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            # Serverdagi loyiha papkasi. Boshqa joyda bo'lsa shu yo'lni o'zgartiring.
            APP_DIR="/home/ec2-user/project-frontend"
            cd "$APP_DIR" || { echo "❌ Papka topilmadi: $APP_DIR"; exit 1; }

            # Docker Compose buyrug'ini aniqlash: v2 plugin ("docker compose")
            # yoki eski v1 binary ("docker-compose").
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "❌ docker compose topilmadi. Docker Compose o'rnating."
              exit 1
            fi

            # .env mavjudligini tekshirish — compose uni talab qiladi
            # (POSTGRES_PASSWORD, SECRET_KEY, SESSION_SECRET majburiy).
            if [ ! -f .env ]; then
              echo "❌ .env fayli yo'q: $APP_DIR/.env"
              echo "   .env.compose.example dan nusxa oling va secretlarni to'ldiring."
              exit 1
            fi

            # Eng so'nggi kodni olish
            git fetch origin main
            sudo chown -R ec2-user:ec2-user .
            git reset --hard origin/main

            # Faqat frontend (web) qayta quriladi; api va db ga tegilmaydi (--no-deps).
            # Next.js kodi image ichida build qilinadi, shuning uchun har deployda qayta build.
            $DC -f compose.yaml up -d --build --force-recreate --no-deps web

            # web konteyner healthy bo'lguncha kutish (compose.yaml dagi healthcheck)
            CID="$($DC -f compose.yaml ps -q web)"
            if [ -z "$CID" ]; then
              echo "❌ web konteyner ishga tushmadi"
              exit 1
            fi
            echo "web konteyner: $CID"
            STATUS=starting
            for i in $(seq 1 30); do
              STATUS="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CID" 2>/dev/null || echo starting)"
              echo "  holat: $STATUS ($i/30)"
              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ]; then
                break
              fi
              if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ]; then
                echo "❌ web $STATUS"
                docker logs --tail 80 "$CID" || true
                exit 1
              fi
              sleep 5
            done
            if [ "$STATUS" != "healthy" ] && [ "$STATUS" != "running" ]; then
              echo "❌ web vaqt ichida ishga tushmadi (oxirgi holat: $STATUS)"
              docker logs --tail 80 "$CID" || true
              exit 1
            fi

            # Ishlatilmayotgan eski imagelarni tozalash
            docker image prune -f

            echo "✅ Frontend deploy muvaffaqiyatli yakunlandi (holat: $STATUS)"
