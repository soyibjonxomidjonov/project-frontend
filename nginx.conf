server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next static export emits <route>.html files; fall back to index.html
    # so client-side routes (e.g. /dashboard/projects/view?id=...) resolve.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
